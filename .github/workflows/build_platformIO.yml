name: PlatformIO

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/build_platformIO.yml"
      - "library.json"
      - "examples/**"
      - "*.cpp"
      - "*.h"
      - "!Dns.*"
      - "!clock-arch.*"
  push:
    branches: [master]
    paths:
      - ".github/workflows/build_platformIO.yml"
      - "library.json"
      - "examples/**"
      - "*.cpp"
      - "*.h"
      - "!Dns.*"
      - "!clock-arch.*"
    tags: ["*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  validate_lib_json:
    name: validate library.json
    uses: nRF24/.github/.github/workflows/validate_platformio.yaml@main
    secrets: inherit

  build:
    needs: [validate_lib_json]
    uses: nRF24/.github/.github/workflows/build_platformio.yaml@main
    with:
      example-path: ${{ matrix.example }}
      board-id: ${{ matrix.board }}
      lib-deps: >-
        -l 256dpi/MQTT
        -l lasselukkari/aWOT
    strategy:
      fail-fast: false
      matrix:
        example:
          - "examples/HTTP_Clients/Getting_Started_SimpleClient_Mesh/Getting_Started_SimpleClient_Mesh.ino"
          - "examples/HTTP_Servers/Getting_Started_SimpleServer_Mesh/Getting_Started_SimpleServer_Mesh.ino"
          - "examples/HTTP_Servers/InteractiveServer_Mesh/*"
          - "examples/HTTP_Servers/InteractiveServer_Mesh_aWOT/InteractiveServer_Mesh_aWOT.ino"
          - "examples/MQTT/mqtt_basic/mqtt_basic.ino"
          - "examples/MQTT/mqtt_basic_2/mqtt_basic_2.ino"
          - "examples/MQTT/mqtt_basic_no_blk/mqtt_basic_no_blk.ino"
          - "examples/HTTP_Clients/SimpleClient_Mesh/SimpleClient_Mesh.ino"

        # these need RF24_TAP defined
        # - "examples/Outdated/SLIP_InteractiveServer/SLIP_InteractiveServer.ino"  # also requires EEPROM.h
        # - "examples/Outdated/TAP/Getting_Started_InteractiveServer/Getting_Started_InteractiveServer.ino"
        # - "examples/Outdated/TAP/Getting_Started_SimpleClient/Getting_Started_SimpleClient.ino"
        # - "examples/Outdated/TAP/Getting_Started_SimpleClient_DNS/Getting_Started_SimpleClient_DNS.ino"
        # - "examples/Outdated/TAP/Getting_Started_SimpleServer/Getting_Started_SimpleServer.ino"
        # - "examples/Outdated/TAP/Getting_Started_SimpleServer_Minimal/Getting_Started_SimpleServer_Minimal.ino"

        # other reasons we exclude the following examples
        # - "examples/Outdated/SLIP_Gateway/SLIP_Gateway.ino"  # hardcoded to use HardwareSerial
        # - "examples/Outdated/TAP/InteractiveServer/InteractiveServer.ino"  # specific to AVR boards
        # - "examples/Outdated/InteractiveServer_Mesh_ESPWifi/InteractiveServer_Mesh_ESPWifi.ino"  # requires ESP8266WiFi.h
        board:
          - "tinypico"
          - "nodemcuv2"
          - "bluepill_f103c8"

  build-tls:
    needs: [validate_lib_json]
    uses: nRF24/.github/.github/workflows/build_platformio.yaml@main
    with:
      example-path: ${{ matrix.example }}
      board-id: ${{ matrix.board }}
      lib-deps: ${{ matrix.lib-deps }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # uses WiFi.h, so ESP32 only
          - example: "examples/TLS/mqtt_basic_tls"
            board: "tinypico"
            lib-deps: >-
              -l 256dpi/MQTT
              -l digitaldragon/SSLClient
          # STM32F411 "black pill"
          - example: "examples/TLS/MQTT_BearSSL"
            board: "blackpill_f411ce"
            lib-deps: >-
              -l 256dpi/MQTT
              -l arduino-libraries/ArduinoBearSSL
              -l vchavezb/lwIP

        # not built here
        # - "examples/TLS/MQTT_BearSSL_UnoQ"  # Arduino App Lab project for the Uno Q

  deploy:
    name: deploy release asset
    if: startsWith(github.ref, 'refs/tags/')
    needs: [validate_lib_json, build]
    permissions:
      # needed for uploading release assets
      contents: write
    uses: nRF24/.github/.github/workflows/deploy_platformio_artifact.yaml@main
    secrets: inherit
